<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <input id="inputText" type="text">
        <button onclick="showText()">출력</button>

        <h1 id="result"></h1>

        <script>
            function showText(){
                let value = document.getElementById("inputText").value;
                if (value === ""){
                    document.getElementById("result").innerText = "입력하세요";
                }
                else if(isNaN(value) == false){
                    document.getElementById("result").innerText = "숫자입니다";
                }
                else {
                    document.getElementById("result").innerText = "문자입니다";
                }
            }
        </script>
    </body>
</html>
