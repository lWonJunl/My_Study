<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>개발 공부 현황</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="status-container">
        <article class="status-card">
            <header>
                <h1>개발 공부 현황</h1>
                <p>현재 학습 중인 기술</p>
            </header>

            <section class="skills">
                <h2>기술 목록</h2>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                    <li>Java</li>
                    <li>SQL</li>
                </ul>
            </section>

            <section class="status">
                <h2>상태</h2>
                <p id="statusMessage">Day10 진행중</p>

                <button id="completeButton">완료</button>
                <button id="processingButton">진행중</button>
            </section>

        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
